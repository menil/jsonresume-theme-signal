name: Auto-Release and Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

# Queue, don't cancel: rapid merges must each produce their own release
concurrency:
  group: auto-release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute Next Version
        id: version
        run: |
          NEXT_VERSION="$(sh scripts/bump-version.sh)"
          if [ -n "$NEXT_VERSION" ]; then
            echo "version=$NEXT_VERSION" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Tag and Release
        if: steps.version.outputs.version != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists; skipping"
            exit 0
          fi
          TAG_REF="refs/tags/$VERSION"
          for attempt in 1 2 3; do
            if gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
                -f ref="$TAG_REF" -f sha="$GITHUB_SHA"; then
              echo "Created tag ref $TAG_REF (attempt $attempt)"
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Failed to create tag ref $TAG_REF after 3 attempts" >&2
              exit 1
            fi
            echo "Tag ref creation attempt $attempt failed; retrying in 5s" >&2
            sleep 5
          done
          gh release create "$VERSION" --target main --generate-notes

  publish-npm:
    needs: release
    if: needs.release.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.version }}

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      # Node 24 ships npm >= 11.5.1, which implements OIDC trusted publishing.
      # Note: Do NOT set registry-url; setup-node would write an empty _authToken into ~/.npmrc,
      # which prevents npm from initiating the OIDC token exchange.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # Bun is required on PATH for the package's prepublishOnly build hook (bun run build).
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.x"

      - name: Install dependencies
        run: nix-shell --run "bun install --frozen-lockfile"

      - name: Run full validation
        run: nix-shell --run "just validate"

      - name: Publish to npm
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          if ! echo "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Error: Invalid version format '$VERSION'" >&2
            exit 1
          fi
          npm version "${VERSION#v}" --no-git-tag-version
          npm publish --access public --provenance
